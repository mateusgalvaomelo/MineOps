services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mineops}
      POSTGRES_USER: ${POSTGRES_USER:-mineops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mineops_demo}
    volumes:
      - mineops_db:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U ${POSTGRES_USER:-mineops} -d ${POSTGRES_DB:-mineops}']
      interval: 5s
      timeout: 5s
      retries: 20
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-mineops}:${POSTGRES_PASSWORD:-mineops_demo}@db:5432/${POSTGRES_DB:-mineops}
      SIMULATION_INTERVAL: ${SIMULATION_INTERVAL:-5}
    depends_on:
      db:
        condition: service_healthy
    ports: ['127.0.0.1:${API_PORT:-8000}:8000']
    healthcheck:
      test: [CMD, python, -c, 'import urllib.request; urllib.request.urlopen("http://localhost:8000/api/health")']
      interval: 10s
      timeout: 5s
      retries: 20
  frontend:
    build: ./frontend
    ports: ['127.0.0.1:${WEB_PORT:-3000}:80']
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, --spider, -q, http://127.0.0.1/]
      interval: 10s
      timeout: 5s
      retries: 10
volumes:
  mineops_db:
