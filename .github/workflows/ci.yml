name: MineOps validation
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r backend/requirements.lock.txt
      - run: ruff check backend
      - run: pytest -q
        working-directory: backend
  demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: docker compose up --build -d --wait
      - run: docker compose exec -T db createdb -U mineops mineops_test_ci
      - run: docker compose run --rm -e TEST_DATABASE_URL=postgresql+psycopg://mineops:mineops_demo@db:5432/mineops_test_ci backend pytest -q
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mineops-browser-evidence
          path: |
            frontend/test-results
            docs/screenshots
      - run: docker compose down
        if: always()
